<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>고리 · 위성 · 꼬리 · 무지개</title>
<style>:root{color-scheme:dark}body{margin:0;background:#07080d;color:#e9e6dc;font:14px/1.5 Pretendard,system-ui,sans-serif;padding:16px}
h1{font-size:18px;margin:0 0 4px}h2{font-size:15px;margin:22px 0 4px;color:#e8c66a}p{color:#9a97a3;margin:0 0 10px;font-size:13px}
.grid{display:flex;gap:14px;flex-wrap:wrap}.cell{text-align:center;font-size:12px;color:#b9b6c2}.cell canvas{display:block;border-radius:14px;background:#0b0c14;margin-bottom:4px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:8px}.row canvas{border-radius:50%;background:#0b0c14}</style></head><body>
<h1>고리 · 위성 · 꼬리 · 무지개 — 움직이는 시안</h1><p>모두 행성 상태와 무관한 장신구. 크게 보기(260px)와 실제 초상 크기(132px)를 함께. 초상에서는 장신구가 들어가도록 행성을 조금 작게 잡았다.</p>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const MAPS=__MAPS__;
const loadImg=u=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=u;});
const LPOS=new THREE.Vector3(5,6,8),LDIR=LPOS.clone().normalize();
function lights(s){s.add(new THREE.AmbientLight(0x9098b8,.5));const k=new THREE.DirectionalLight(0xfff4e6,1.35);k.position.copy(LPOS);s.add(k);const r=new THREE.DirectionalLight(0x9fc0ff,.45);r.position.set(-6,3,-9);s.add(r);}
const TEX={};async function tex(key){if(TEX[key])return TEX[key];const im=await loadImg(MAPS[key]);const t=new THREE.Texture(im);t.needsUpdate=true;t.encoding=THREE.sRGBEncoding;t.anisotropy=8;TEX[key]=t;return t;}
async function planetMesh(key){const map=await tex(key);return new THREE.Mesh(new THREE.SphereGeometry(1,128,96),new THREE.MeshStandardMaterial({map,bumpMap:map,bumpScale:.015,roughness:.8,metalness:0}));}
// ── 반짝이는 고리(토성형): 반지름 방향 결(밝고 어두운 띠 + 틈), 행성 그림자가 고리에 드리움, 작은 반짝임이 돈다 ──
function ringMat(inner,outer,tint,op){return new THREE.ShaderMaterial({uniforms:{L:{value:LDIR},time:{value:0},tint:{value:new THREE.Color(tint)},op:{value:op},ri:{value:inner},ro:{value:outer}},
  vertexShader:'varying vec3 vW;varying vec3 vL;void main(){vL=position;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}',
  fragmentShader:'uniform vec3 L,tint;uniform float time,op,ri,ro;varying vec3 vW;varying vec3 vL;'+
   'float h(float x){return fract(sin(x*91.7)*43758.5);}float n1(float x){float i=floor(x),f=fract(x);return mix(h(i),h(i+1.),f*f*(3.-2.*f));}'+
   'void main(){float r=length(vL.xy);float t=(r-ri)/(ro-ri);if(t<0.||t>1.)discard;'+
   'float bands=.35+.4*n1(t*11.+2.)+.25*n1(t*27.)*n1(t*5.+7.);float gap=smoothstep(.02,.0,abs(t-.62))*.85+smoothstep(.015,.0,abs(t-.3))*.5;'+
   'float edge=smoothstep(0.,.06,t)*smoothstep(1.,.9,t);float a=bands*(1.-gap)*edge*op;'+
   // 행성 그림자: 이 점에서 빛 쪽으로 쏜 선이 반지름 1 구와 만나면 그늘
   'vec3 c0=vec3(0.);vec3 p=vW-c0;float b=dot(p,L);float d2=dot(p,p)-b*b;float shade=(b<0.&&d2<1.)?.18:1.;'+
   'float ang=atan(vL.y,vL.x);float sp=pow(max(0.,sin(ang*40.+time*.6+t*60.)),40.)*.6;'+
   'vec3 col=tint*(.8+.25*n1(t*17.))*shade+vec3(sp)*shade;gl_FragColor=vec4(col,a);}',
  transparent:true,side:THREE.DoubleSide,depthWrite:false});}
function ring(inner,outer,tilt,tint,op){const g=new THREE.RingGeometry(inner,outer,256,1);const m=new THREE.Mesh(g,ringMat(inner,outer,tint,op));m.rotation.set(-Math.PI/2+tilt[0],0,tilt[1]);return m;}
// ── 위성: 작은 달(구덩이 지도 흑백) ──
async function moon(r,key,gray){const map=await tex(key);const m=new THREE.Mesh(new THREE.SphereGeometry(r,48,32),new THREE.MeshStandardMaterial({map,color:gray,roughness:.95,metalness:0}));return m;}
// ── 혜성 꼬리: 햇빛 반대쪽으로. 가는 이온 꼬리(청백, 곧음) + 먼지 꼬리(따뜻한 흰색, 살짝 휨), 아주 부드럽게 ──
function tailMesh(len,w0,w1,col,op,bend){const SEG=40,geo=new THREE.BufferGeometry();const P=[],U=[],I=[];
  for(let i=0;i<=SEG;i++){const t=i/SEG;const w=w0+(w1-w0)*Math.pow(t,.9);const y=t*len;const bx=bend*t*t*len;P.push(-w/2+bx,y,0,w/2+bx,y,0);U.push(0,t,1,t);if(i<SEG){const a=i*2;I.push(a,a+1,a+2,a+1,a+3,a+2);}}
  geo.setAttribute('position',new THREE.Float32BufferAttribute(P,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));geo.setIndex(I);
  return new THREE.Mesh(geo,new THREE.ShaderMaterial({uniforms:{c:{value:new THREE.Color(col)},op:{value:op},time:{value:0}},
    vertexShader:'varying vec2 vU;void main(){vU=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'uniform vec3 c;uniform float op,time;varying vec2 vU;float h(vec2 p){return fract(sin(dot(p,vec2(12.9,78.2)))*43758.5);}'+
      'void main(){float side=exp(-pow((vU.x-.5)*2.4,2.));float along=pow(1.-vU.y,.85)*smoothstep(0.,.04,vU.y);'+
      'float st=.8+.2*sin(vU.x*30.+vU.y*14.-time*1.5);gl_FragColor=vec4(c*1.2,op*side*along*st);}',
    transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));}
function tail(level){const L=[0,1.3,2.3,3.4][level];const g=new THREE.Group();
  const ion=tailMesh(L,.2,.3+.06*level,0xa8d6ff,1.25,0);const dust=tailMesh(L*.85,.38,.75+.16*level,0xfff1dc,.8,.12);
  ion.position.y=.75;dust.position.y=.7;g.add(dust);g.add(ion);return g;}
// ── 무지개 (A 확정, 빨강·주황 보강) ──
function rainbow(){const SEG=200,A0=140*Math.PI/180,A1=285*Math.PI/180,r0=1.3,r1=1.4,cx=.08,cy=.02;const pos=[],uv=[],idx=[];
  for(let i=0;i<=SEG;i++){const u=i/SEG,a=A0+(A1-A0)*u,c=Math.cos(a),s=Math.sin(a);pos.push(c*r0+cx,s*r0+cy,0,c*r1+cx,s*r1+cy,0);uv.push(u,0,u,1);if(i<SEG){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));geo.setIndex(idx);
  return new THREE.Mesh(geo,new THREE.ShaderMaterial({uniforms:{time:{value:0}},vertexShader:'varying vec2 vU;void main(){vU=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'uniform float time;varying vec2 vU;'+
      // 바깥(v=1) 빨강 → 주황 → 노랑 → 초록 → 파랑 → 안쪽 보라, 폭을 고르게(빨강·주황이 묻히지 않게)
      'vec3 rb(float v){vec3 c[6];c[0]=vec3(.55,.25,1.);c[1]=vec3(.2,.45,1.);c[2]=vec3(.25,.95,.45);c[3]=vec3(1.,.92,.25);c[4]=vec3(1.,.55,.12);c[5]=vec3(1.,.18,.14);'+
      'float x=clamp(v,0.,1.)*5.;int i=int(floor(x));float f=fract(x);vec3 a=c[0],b=c[1];'+
      'if(i==1){a=c[1];b=c[2];}else if(i==2){a=c[2];b=c[3];}else if(i==3){a=c[3];b=c[4];}else if(i>=4){a=c[4];b=c[5];}return mix(a,b,f);}'+
      'void main(){float v=vU.y;vec3 c=rb(v);float band=smoothstep(0.,.14,v)*smoothstep(1.,.86,v);float ends=smoothstep(0.,.22,vU.x)*smoothstep(1.,.78,vU.x);'+
      'float sh=.85+.15*sin(vU.x*18.-time*1.2);float a=band*ends*sh*1.15;gl_FragColor=vec4(c*a,a);}',
    transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));}
// ── 장면 구성 ──
const SPECS=[
  {title:'반짝이는 고리 (재성 제안)',key:'su-mok',fx:'ring'},
  {title:'기울어진 두 줄 고리 (관성 제안)',key:'to-mok-hwa',fx:'ring2'},
  {title:'쌍둥이 달 (비겁 제안)',key:'geum-to',fx:'moons'},
  {title:'꼬리 1단계',key:'mok-hwa-to',fx:'tail1'},{title:'꼬리 2단계',key:'mok-hwa-to',fx:'tail2'},{title:'꼬리 3단계',key:'mok-hwa-to',fx:'tail3'},
  {title:'무지개 A (색 보정)',key:'su-mok',fx:'rainbow'}];
async function build(spec,portrait){const S=new THREE.Scene();lights(S);const g=new THREE.Group();g.add(await planetMesh(spec.key));g.rotation.x=.25;S.add(g);const upd=[];
  const fx=spec.fx;
  if(fx==='ring'){const r=ring(1.3,2.1,[.42,.12],0xf2e3c6,.7);S.add(r);upd.push(t=>r.material.uniforms.time.value=t);}
  if(fx==='ring2'){const a=ring(1.45,1.56,[.55,.35],0xd9e4ff,.9),b=ring(1.7,1.78,[.35,-.55],0xffe2c4,.8);S.add(a);S.add(b);upd.push(t=>{a.material.uniforms.time.value=t;b.material.uniforms.time.value=t;});}
  if(fx==='moons'){const m1=await moon(.33,'geum',0xd8d8d8),m2=await moon(.23,'to',0xc8beb4);S.add(m1);S.add(m2);
    upd.push(t=>{const a=t*.45,b=t*.45+Math.PI;m1.position.set(Math.cos(a)*1.75,Math.sin(a)*.3,Math.sin(a)*1.6);m2.position.set(Math.cos(b)*1.75,Math.sin(b)*.3,Math.sin(b)*1.6);m1.rotation.y=t*.3;m2.rotation.y=t*.3;});}
  if(fx.startsWith('tail')){const tl=tail(+fx.slice(4));tl.rotation.z=Math.PI*.78;tl.position.z=-.15;S.add(tl);upd.push(t=>tl.children.forEach(c=>c.material.uniforms.time.value=t));}
  if(fx==='rainbow'){const rb=rainbow();S.add(rb);upd.push((t,cam)=>{rb.material.uniforms.time.value=t;rb.quaternion.copy(cam.quaternion);});}
  const zoom=portrait?(fx.startsWith('tail')?2.8:fx==='rainbow'?1.75:2.35):(fx.startsWith('tail')?3.0:fx==='rainbow'?1.9:2.5);
  const cam=new THREE.PerspectiveCamera(30,1,.1,100);cam.position.set(0,.3,1).normalize().multiplyScalar(zoom/Math.tan(15*Math.PI/180));
  const look=fx.startsWith('tail')?new THREE.Vector3(-.8,-.8,0):new THREE.Vector3(0,0,0);cam.lookAt(look);
  return {S,g,cam,upd};}
(async()=>{const root=document.getElementById('root');const items=[];
  const sec=(h)=>{const d=document.createElement('div');d.innerHTML='<h2>'+h+'</h2>';root.appendChild(d);const gr=document.createElement('div');gr.className='grid';d.appendChild(gr);return gr;};
  const gBig=sec('크게 보기');const gSmall=sec('실제 초상 크기 132px');
  for(const sp of SPECS){for(const [box,px,por] of [[gBig,260,false],[gSmall,132,true]]){
    const cell=document.createElement('div');cell.className='cell';const cv=document.createElement('canvas');cv.width=cv.height=px*2;cv.style.width=cv.style.height=px+'px';cell.appendChild(cv);
    const lb=document.createElement('div');lb.textContent=sp.title;cell.appendChild(lb);box.appendChild(cell);
    const r=new THREE.WebGLRenderer({canvas:cv,antialias:true});r.outputEncoding=THREE.sRGBEncoding;const b=await build(sp,por);items.push({r,...b});}}
  const t0=performance.now();(function loop(now){const t=(now-t0)/1000;
    for(const it of items){it.g.rotation.y=-.9+t*.12;it.upd.forEach(f=>f(t,it.cam));it.r.setClearColor(0x0b0c14,1);it.r.render(it.S,it.cam);}
    requestAnimationFrame(loop);})(t0);})();
</script></body></html>
